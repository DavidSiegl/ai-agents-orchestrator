[package]
name = "octoflow-engine"
version = "0.1.0"
description = "The orchestrator's engine, ported from orchestrator.py (the rust-engine spec)"
edition = "2021"
publish = false

[dependencies]
serde = "1"
# float_roundtrip: a float reads as the nearest f64, as Python reads it, so that state.json writes back as it was.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
