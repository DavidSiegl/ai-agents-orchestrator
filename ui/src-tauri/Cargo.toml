[package]
name = "octoflow-ui"
version = "0.1.0"
description = "A read-only window over the orchestrator's runs, with orchestrator.py serve as its sidecar"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
# The _lib suffix keeps the library's name apart from the binary's, which Cargo needs on Windows.
name = "octoflow_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# clippy's rules, which are the workspace's (Cargo.toml at the repository's top).
[lints]
workspace = true
