[package]
name = "octoflow-ui"
version = "0.1.0"
description = "A read-only window over the orchestrator's runs, with orchestrator.py serve as its sidecar"
edition = "2021"

[lib]
# The _lib suffix keeps the library's name apart from the binary's, which Cargo needs on Windows.
name = "octoflow_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# clippy's rules for this crate, by which gate.py judges a change to its Rust (docs/quality-gate.md): clippy's
# defaults, and these, which main passed when they were set. Each at warn: the gate fails a finding at either level on
# a line the change adds, and at deny one finding would stop clippy, and cargo test, at this crate.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
# A suppression says why it stands: `#[allow(lint, reason = "...")]`.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
