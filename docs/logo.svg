<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">An octopus holding a terminal, a robot and a chat bubble</title>
  <circle cx="100" cy="100" r="96" fill="#E3F1EF"/>
  <g fill="none" stroke="#2A9D8F" stroke-width="2.5">
    <circle cx="150" cy="34" r="5"/>
    <circle cx="161" cy="21" r="3"/>
    <circle cx="44" cy="30" r="3.5"/>
  </g>

  <!-- Harness: a terminal -->
  <g transform="rotate(-10 26 75)">
    <rect x="6" y="60" width="40" height="30" rx="4.5" fill="#1E2A38"/>
    <circle cx="12" cy="65.5" r="1.6" fill="#EE7B5E"/><circle cx="17" cy="65.5" r="1.6" fill="#F2B33D"/><circle cx="22" cy="65.5" r="1.6" fill="#2A9D8F"/>
    <path d="M12 72 l5 4 l-5 4" fill="none" stroke="#7FE0D2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 81 h8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Agent: a robot -->
  <g>
    <path d="M171 64 V56" stroke="#1E2A38" stroke-width="3" stroke-linecap="round"/>
    <circle cx="171" cy="53" r="3.5" fill="#F2B33D" stroke="#1E2A38" stroke-width="2.5"/>
    <rect x="157" y="64" width="28" height="24" rx="7" fill="#FFFFFF" stroke="#1E2A38" stroke-width="3.5"/>
    <rect x="161.5" y="69" width="19" height="10" rx="5" fill="#1E2A38"/>
    <circle cx="166.5" cy="74" r="2.2" fill="#7FE0D2"/><circle cx="175.5" cy="74" r="2.2" fill="#7FE0D2"/>
  </g>
  <!-- Handoff: a chat bubble -->
  <g stroke="#1E2A38" stroke-width="2.5" stroke-linejoin="round">
    <path d="M143 146 H160 A7 7 0 0 1 167 153 V159 A7 7 0 0 1 160 166 H150 L140 173 L143 166 A7 7 0 0 1 136 159 V153 A7 7 0 0 1 143 146 Z" fill="#FFFFFF"/>
  </g>
  <g fill="#1E2A38">
    <circle cx="144.5" cy="156" r="2.2"/><circle cx="151.5" cy="156" r="2.2"/><circle cx="158.5" cy="156" r="2.2"/>
  </g>

  <g fill="none" stroke="#EE7B5E" stroke-width="13" stroke-linecap="round">
    <path d="M66 108 C46 120 30 114 27 94"/>
    <path d="M134 108 C154 120 170 114 173 94"/>
    <path d="M72 114 C60 138 46 150 36 146 C28 142 31 133 38 135"/>
    <path d="M88 118 C86 144 78 160 66 167 C58 171 53 163 59 159"/>
    <path d="M108 118 C110 140 116 156 124 164 C130 170 137 168 141 172"/>
    <path d="M126 114 C140 136 152 140 160 136 C167 132 165 124 159 126"/>
  </g>
  <g fill="#F9C4B4">
    <circle cx="40" cy="113" r="2"/><circle cx="32" cy="104" r="2"/>
    <circle cx="160" cy="113" r="2"/><circle cx="168" cy="104" r="2"/>
  </g>

  <path d="M48 86 C48 42 74 22 100 22 C126 22 152 42 152 86 C152 104 140 116 126 119 L74 119 C60 116 48 104 48 86 Z" fill="#EE7B5E"/>
  <g fill="#D9603F">
    <circle cx="76" cy="48" r="5"/><circle cx="89" cy="37" r="3"/><circle cx="124" cy="45" r="4"/>
  </g>
  <ellipse cx="69" cy="97" rx="7" ry="4.5" fill="#F7A8A0"/>
  <ellipse cx="131" cy="97" rx="7" ry="4.5" fill="#F7A8A0"/>
  <circle cx="82" cy="83" r="9" fill="#1E2A38"/>
  <circle cx="118" cy="83" r="9" fill="#1E2A38"/>
  <circle cx="85" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="121" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="79.5" cy="86.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="115.5" cy="86.5" r="1.5" fill="#FFFFFF"/>
  <path d="M93 98 Q100 105 107 98" fill="none" stroke="#1E2A38" stroke-width="3" stroke-linecap="round"/>
</svg>
