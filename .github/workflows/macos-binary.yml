# Jenkins tests, builds and releases; it has no macOS machine, so this builds the macOS binary and the desktop app
# around it. For a release Jenkins has published, or a dispatch for an existing one, it adds them to that release; it
# never creates a release or a tag: gh release upload fails if the release is missing. For a pull request that
# touches what goes into them, it only builds them, so that a change breaking the macOS build fails before it merges.
name: macOS binary

on:
  release:
    types: [published]
  # To build it again for an existing release, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release, e.g. v0.5.0
        required: true
        type: string
  # Advisory, not required by the ci-cd ruleset. Only for what the build reads, since macOS runner minutes cost.
  pull_request:
    paths:
      - packaging/**
      - ui/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - pyproject.toml
      - uv.lock
      - .python-version
      - orchestrator.py
      - .github/workflows/macos-binary.yml

# Each job asks for what it needs: only upload, which runs no code of the change, may write to releases.
permissions: {}

env:
  # The release's tag, which the build checks out and the upload adds to; empty for a pull request.
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

# A newer push to a pull request replaces its build in progress. Runs for one tag, a release's and a dispatch's, wait
# for each other rather than both uploading with --clobber: the one in progress always finishes, and a newer one
# replaces one still waiting, as GitHub keeps one pending run per group; it builds and uploads the same tag. The tag
# is TAG's, written again here because a concurrency group cannot read env.
concurrency:
  group: >-
    macos-binary-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('tag-{0}', github.event.release.tag_name || inputs.tag) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    # A release build takes about 4 minutes; a check that hangs fails the job here rather than after 6 hours.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # uv's own Python, which bundles Tcl/Tk. uv would otherwise take the runner's Homebrew python@3.14, which has
      # no tkinter, and PyInstaller would leave the GUI out of the binary. Set here, not in build-binary.sh, so a
      # rebuild of a tag cut before this fix gets it too.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # A pull request's head, as it was pushed; a release's or a dispatch's tag.
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha
            || format('refs/tags/{0}', env.TAG) }}

      - uses: astral-sh/setup-uv@v6

      # The script Jenkins builds the Linux binary with; it smoke-tests --help, workflows and gui --smoke-test.
      - run: packaging/build-binary.sh

      # The runner's Rust builds the shell; Node is pinned to what ui/package.json's tools need, 20.19 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The script Jenkins builds the Linux app with, around that binary.
      - run: packaging/build-desktop.sh

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            dist/octoflow-macos-arm64
            dist/octoflow-macos-arm64.sha256
            dist/octoflow-desktop-macos-arm64.dmg
            dist/octoflow-desktop-macos-arm64.dmg.sha256
          if-no-files-found: error
          # Long enough to re-run a failed upload on its own, without building again.
          retention-days: 7

  upload:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # dist/ then holds the build's artifact and nothing else, the asset list above.
      - uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber
