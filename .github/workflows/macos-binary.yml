# Jenkins tests, builds and releases; it has no macOS machine, so this adds only the macOS binary and the desktop
# app around it to a release Jenkins has published. It never creates a release or a tag: gh release upload fails
# if the release is missing.
name: macOS binary

on:
  release:
    types: [published]
  # To build it again for an existing release, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release, e.g. v0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-binary:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      # uv's own Python, which bundles Tcl/Tk. uv would otherwise take the runner's Homebrew python@3.14, which has
      # no tkinter, and PyInstaller would leave the GUI out of the binary. Set here, not in build-binary.sh, so a
      # rebuild of a tag cut before this fix gets it too.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      # The script Jenkins builds the Linux binary with; it smoke-tests --help, workflows and gui --smoke-test.
      - run: packaging/build-binary.sh

      # The runner's Rust builds the shell; Node is pinned to what ui/package.json's tools need, 20.19 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The script Jenkins builds the Linux app with, around that binary.
      - run: packaging/build-desktop.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/orchestrator-macos-arm64 dist/orchestrator-macos-arm64.sha256 \
            dist/orchestrator-desktop-macos-arm64.dmg dist/orchestrator-desktop-macos-arm64.dmg.sha256 --clobber
